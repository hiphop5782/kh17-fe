<script type="text/javascript">
    
    //(Q) data에 들어 있는 값을 이용해서 다음 결과를 만들어 내세요
    //1. 홀수만 필터링 → [5, 3, 7, 1]
    //2. 1번에서 필터링된 결과 데이터를 각각 제곱 → [25, 9, 49, 1]
    //3. 2번의 결과에서 20 이하만 필터링 → [9, 1]
    //4. 3번의 결과를 출력
    //추가로 알아야 할 함수 : map(검색해보세요)

    const data = [5, 3, 2, 7, 8, 1, 6];

    //ES5
    var step1 = [], step2 = [], step3 = [];
    
    for(var i=0; i < data.length; i++) {
        if(data[i] % 2 != 0) {//홀수
            step1.push(data[i]);//추가
        }
    }

    for(var i=0; i < step1.length; i++) {
        var square = step1[i] * step1[i];
        step2.push(square);
    }

    for(var i=0; i < step2.length; i++) {
        if(step2[i] <= 20) {
            step3.push(step2[i]);
        }
    }

    for(var i=0; i < step3.length; i++) {
        console.log(step3[i]);
    }

    //ES6
    data.filter(n=>n%2!=0)
        .map(n=>n*n)
        .filter(n=>n<=20)
        .sort((a,b)=>a-b)
        .forEach(n=>console.log(n));


    //(Q) 만약 다음 배열에서 20을 지우려면?
    const numbers = [10, 20, 30, 40, 50];

    //원본이 변경되는 좋지 않은 방식
    //const index = numbers.indexOf(20);//20의 위치를 찾아 index에 저장
    //numbers.splice(index, 1);//index부터 1칸을 지워라
    //console.log(numbers);

    //사본을 만드는 방식
    //- slice는 원본 변경 없이 원하는 구간을 잘라서 사본을 만들어냄
    //- filter로 원하는 데이터만 빼고 검색하면 삭제 효과가 발생
    const res = numbers.filter(n => n !== 20);
    console.log(res);


</script>
