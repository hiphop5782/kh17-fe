<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="/kh.jpg" type="image/jpeg">

    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        div { box-shadow: 0 0 0 1px #cccccc;}
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        //자바스크립트가 제공해주는 내장객체의 종류와 활용
        //console.log(window);

        function window01() {
            //window.alert("알림창 테스트");//window 객체에 있는 alert 함수를 실행
            alert("알림창 테스트");//window는 생략 가능
        }
        function window02() {
            var choice = window.confirm("확인창 테스트");
            console.log("choice", choice);
        }
    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>자바스크립트의 내장객체</h1>
        </div>

        <div class="cell">
            <button type="button" class="btn btn-neutral" onclick="window01();">알림창</button>
            <button type="button" class="btn btn-neutral" onclick="window02();">확인창</button>
            <button type="button" class="btn btn-neutral">입력창</button>
            <button type="button" class="btn btn-neutral">새탭</button>
            <button type="button" class="btn btn-neutral">새창</button>
            <button type="button" class="btn btn-neutral">윈도우정보</button>
        </div>
    </div>
</body>
</html>
