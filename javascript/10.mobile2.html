<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="/kh.jpg" type="image/jpeg">

    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        div { box-shadow: 0 0 0 1px #cccccc;}
    </style>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        //버전2 : 함수 3개로 구현 (숫자버튼용함수, 한글자지우기, 전체지우기)
        function numberButton(number){
            var display = document.querySelector(".display");
            display.value += number;
        }
        function numberDelete(){
            //마지막 한 글자를 지운다 
            // = 입력글자를 꺼내와서 끝부분을 잘라낸 뒤 재설정
            // = 잘라내는 명령 - substring(시작점, 끝점)
            // = 글자수 구하기 - length
            var display = document.querySelector(".display");
            var origin = display.value;
            var cut = origin.substring(0, origin.length-1);
            display.value = cut;
        }
        function numberClear(){
            var display = document.querySelector(".display");
            display.value = "";
        }
    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>휴대폰 키패드</h1>
        </div>

        <div class="cell">
            <input class="field w-100 display">
        </div>

        <div class="cell">
            <button type="button" onclick="numberButton('7');">7</button>
            <button type="button" onclick="numberButton('8');">8</button>
            <button type="button" onclick="numberButton('9');">9</button>
        </div>
        <div class="cell">
            <button type="button" onclick="numberButton('4');">4</button>
            <button type="button" onclick="numberButton('5');">5</button>
            <button type="button" onclick="numberButton('6');">6</button>
        </div>
        <div class="cell">
            <button type="button" onclick="numberButton('1');">1</button>
            <button type="button" onclick="numberButton('2');">2</button>
            <button type="button" onclick="numberButton('3');">3</button>
        </div>
        <div class="cell">
            <button type="button" onclick="numberButton('*');">*</button>
            <button type="button" onclick="numberButton('0');">0</button>
            <button type="button" onclick="numberButton('#');">#</button>
        </div>
        
        <div class="cell">
            <button type="button" onclick="numberDelete();">한글자</button>
            <button type="button" onclick="numberClear();">전체</button>
        </div>
    </div>
</body>
</html>
