<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 수업</title>
    <link rel="icon" href="/kh.jpg" type="image/jpeg">

    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="./commons.css">
    <style>
        /* div { box-shadow: 0 0 0 1px gray ;} */
    </style>
</head>
<body>
    <!-- 메인 컨테이너1 + 내부영역4 -->
    <div class="container w-1200">
        <div class="flex-area flex-vertical">
            <!-- 헤더 영역 -->
            <div class="flex-area">
                <div class="w-25 flex-area flex-center">
                    <img src="https://www.dummyimage.com/200x50">
                </div>
                <div class="w-50 flex-area flex-center">
                    <h1>KH정보교육원 스프링개발자 수업자료</h1>
                </div>
                <div class="w-25 flex-area flex-center">
                    <div class="center">
                        <h2 class="mt-0 mb-0">24시간상담</h2>
                        <div>1588-0000</div>                        
                    </div>
                </div>
            </div>

            <!-- 메뉴 -->
            <div>
                <ul class="menu">
                    <li>
                        <a href="#">
                            <i class="fa-solid fa-house"></i>
                            <span>홈</span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class="fa-solid fa-database"></i>
                            <span>데이터</span>

                            <!-- 하위 메뉴 -->
                            <ul>
                                <li>
                                    <a href="#">
                                        <i class="fa-solid fa-flag"></i>
                                        <span>국가정보</span>
                                    </a>
                                </li>
                                <li>
                                    <a href="#">
                                        <i class="fa-solid fa-chalkboard-user"></i>
                                        <span>강좌정보</span>
                                    </a>
                                </li>
                                <li>
                                    <a href="#">
                                        <i class="fa-solid fa-book"></i>
                                        <span>도서정보</span>
                                    </a>
                                </li>
                            </ul>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <i class="fa-solid fa-comments"></i>
                            <span>게시판</span>
                        </a>
                    </li>
                    
                    <li class="divider"></li>

                    <li>
                        <a href="#">
                            <i class="fa-solid fa-right-to-bracket"></i>
                            <span>로그인</span>
                        </a>
                        <!-- 하위메뉴 -->
                        <ul>
                            <li>
                                <a href="#">
                                    <i class="fa-solid fa-user-plus"></i>
                                    <span>회원가입</span>
                                </a>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>

            <!-- 사이드바 및 컨텐츠 -->
            <div>사이드바+컨텐츠</div>

            <!-- 푸터 -->
            <div style="border-top: 1px solid gray;" class="flex-area">
                <div class="w-50">
                    <div class="container w-100">
                        <div class="cell">
                            <h2>KH정보교육원</h2>
                        </div>
                        <div class="cell">
                            OO시 OO구 OO동 000-000번지
                        </div>
                        <div class="cell">
                            대표자 - 피카츄
                        </div>
                        <div class="cell">
                            고객센터 - (02) 1234-5678
                        </div>
                    </div>
                </div>
                <div class="w-25 center">
                    <div class="container w-100">
                        <div class="cell">
                            <h2>지점 정보</h2>
                        </div>
                        <div class="cell">
                            <span>강남지점</span>
                            <a href="#"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>
                        </div>
                        <div class="cell">
                            <span>종로지점</span>
                            <a href="#"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>
                        </div>
                        <div class="cell">
                            <span>당산지점</span>
                            <a href="#"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>
                        </div>
                        <div class="cell">
                            <span>부산지점</span>
                            <a href="#"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>
                        </div>
                    </div>
                </div>
                <div class="w-25 center">
                    <div class="container w-100">
                        <div class="cell">
                            <h2>운영 방침</h2>
                        </div>
                        <div class="cell">
                            <a href="#">
                                <i class="fa-regular fa-clipboard"></i>
                                <span>홈페이지 이용약관</span>
                            </a>
                        </div>
                        <div class="cell">
                            <a href="#">
                                <i class="fa-solid fa-user-lock"></i>
                                <span>개인정보 처리방침</span>
                            </a>
                        </div>

                        <div class="cell">
                            <h2>파트너쉽</h2>
                        </div>
                        <div class="cell">
                            <i class="fa-brands fa-2x fa-google"></i>
                            <i class="fa-brands fa-2x fa-line"></i>
                            <i class="fa-brands fa-2x fa-facebook"></i>
                            <i class="fa-brands fa-2x fa-instagram"></i>
                            <i class="fa-brands fa-2x fa-linkedin"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
