<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery 수업</title>
    <link rel="icon" href="/kh.jpg" type="image/jpeg">

    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        div { box-shadow: 0 0 0 1px #cccccc;}
    </style>

    <!-- jQuery CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        $(function(){
            //[1] 1페이지 빼고 다 숨김
            //$(".page").hide();
            //$(".page").eq(0).show();
            //$(".page").first().show();
            $(".page").hide().first().show();

            //[2] 다음버튼을 누르면 현재 .page 숨기고 다음 .page를 보여준다
            $(".btn-next").on("click", function(){
                //$(this).parent(".page").hide();
                //$(this).parent(".page").next(".page").show();
                $(this).parent(".page").hide().next(".page").show();
            });

            //[3] 이전버튼을 누르면 현재 .page 숨기고 이전 .page를 보여준다
            $(".btn-prev").on("click", function(){
                $(this).parent(".page").hide().prev(".page").show();
            });
        });
    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>멀티페이지 문제</h1>
        </div>

        <div class="cell page">
            <h1>1페이지</h1>

            <button type="button" class="btn btn-neutral btn-next">
                <span>다음</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <div class="cell page">
            <h1>2페이지</h1>

            <button type="button" class="btn btn-neutral btn-prev">
                <i class="fa-solid fa-arrow-left"></i>
                <span>이전</span>
            </button>
            <button type="button" class="btn btn-neutral btn-next">
                <span>다음</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <div class="cell page">
            <h1>3페이지</h1>

            <button type="button" class="btn btn-neutral btn-prev">
                <i class="fa-solid fa-arrow-left"></i>
                <span>이전</span>
            </button>
            <button type="button" class="btn btn-neutral btn-next">
                <span>다음</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <div class="cell page">
            <h1>4페이지</h1>

            <button type="button" class="btn btn-neutral btn-prev">
                <i class="fa-solid fa-arrow-left"></i>
                <span>이전</span>
            </button>
            <button type="button" class="btn btn-neutral btn-next">
                <span>다음</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <div class="cell page">
            <h1>5페이지</h1>

            <button type="button" class="btn btn-neutral btn-prev">
                <i class="fa-solid fa-arrow-left"></i>
                <span>이전</span>
            </button>
        </div>
    </div>
</body>
</html>
