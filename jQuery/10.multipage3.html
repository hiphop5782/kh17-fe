<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery 수업</title>
    <link rel="icon" href="/kh.jpg" type="image/jpeg">

    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        div { box-shadow: 0 0 0 1px #cccccc;}

        /* progressbar 디자인 */
        .progressbar {
            height: 5px;
        }
        .progressbar > .gauge {
            width: 0%;
            height: 100%;
            
            transition: width 0.1s ease-out;

            background: #833AB4;
            background: linear-gradient(90deg, rgba(131, 58, 180, 1) 0%, rgba(253, 29, 29, 1) 50%, rgba(252, 176, 69, 1) 100%);
        }
    </style>

    <!-- jQuery CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        $(function(){
            //[1] 1페이지 빼고 다 숨김
            $(".page").hide().first().show();
            calculateGauge();

            //[2] 다음버튼을 누르면 현재 .page 숨기고 다음 .page를 보여준다
            $(".btn-next").on("click", function(){
                $(this).closest(".page").hide().next(".page").show();//가장 가까운 .page
                calculateGauge();
            });

            //[3] 이전버튼을 누르면 현재 .page 숨기고 이전 .page를 보여준다
            $(".btn-prev").on("click", function(){
                $(this).closest(".page").hide().prev(".page").show();
                calculateGauge();
            });

            // progressbar 처리
            // [1] 처음에 .gauge의 폭을 설정
            //$(".progressbar > .gauge").css("width", "20%");
            //$(".progressbar").find(".gauge").css("width", 100 / $(".page").length +"%");

            //(+추가) 보여지는 페이지의 위치를 계산
            function calculateGauge() {
                if($(".progressbar").length == 0) return;

                var current = $(".page:visible");//보여지는 페이지를 선택
                var page = $(".page").index(current) + 1;//전체 페이지 중 몇 번째 index인지 계산
                var percent = page * 100 / $(".page").length;
                $(".progressbar").find(".gauge").css("width", percent+"%");
            }
        });
    </script>
</head>
<body>
    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>멀티페이지 문제</h1>
        </div>

        <!-- 진행도를 나타내기 위한 progressbar -->
        <div class="progressbar">
            <div class="gauge"></div>
        </div>

        <div class="cell page">

            <div class="container">
                <div class="cell center">
                    <h1>1페이지</h1>
                </div>

                <div class="cell flex-area">
                    <div class="w-100 left">
                        <!-- <button type="button" class="btn btn-neutral btn-prev">
                            <i class="fa-solid fa-arrow-left"></i>
                            <span>이전</span>
                        </button> -->
                    </div>
                    <div class="w-100 right">
                        <button type="button" class="btn btn-neutral btn-next">
                            <span>다음</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <div class="cell page">
            <div class="container">
                <div class="cell center">

                        <button type="button" class="btn btn-neutral btn-prev">

                    <div class="w-100 right">

                            <span>다음</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="cell page">
            <div class="container">
                <div class="cell center">
                    <h1>3페이지</h1>
                </div>

                <div class="cell flex-area">
                    <div class="w-100 left">
                        <button type="button" class="btn btn-neutral btn-prev">
                            <i class="fa-solid fa-arrow-left"></i>
                            <span>이전</span>
                        </button>
                    </div>
                    <div class="w-100 right">
                        <button type="button" class="btn btn-neutral btn-next">
                            <span>다음</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="cell page">
            <div class="container">
                <div class="cell center">
                    <h1>4페이지</h1>
                </div>

                <div class="cell flex-area">
                    <div class="w-100 left">
                        <button type="button" class="btn btn-neutral btn-prev">

                            <span>이전</span>
                        </button>
                    </div>
                    <div class="w-100 right">
                        <button type="button" class="btn btn-neutral btn-next">
                            <span>다음</span>

                        </button>

        </div>

        <div class="cell page">
            <div class="container">

                <div class="cell flex-area">

                        </button>
                    </div>
                    <div class="w-100 right">
                        <!-- <button type="button" class="btn btn-neutral btn-next">
                            <span>다음</span>

</html>
