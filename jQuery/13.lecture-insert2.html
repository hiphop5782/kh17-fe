<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery 수업</title>
    <link rel="icon" href="/kh.jpg" type="image/jpeg">

    <!-- 아이콘 -->
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- 디자인을 작성하기 위한 영역 -->
    <link rel="stylesheet" type="text/css" href="../css/commons.css">
    <style>
        div { box-shadow: 0 0 0 1px #cccccc;}
    </style>

    <!-- jQuery CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- 자바스크립트 작성 영역 -->
    <script>
        $(function(){
            //상태 객체
            var state = {
                lectureTitleValid : false,
                lectureCategoryValid : false,
                lectureDurationValid : false,
                lecturePriceValid : false,
                lectureTypeValid : false,
                ok : function() {
                    return Object.values(this)//이 객체의 모든 이름에 대한 값을 반환
                            .filter(v => typeof v === "boolean")//)//boolean값만 추출해서
                            .every(v => v === true);//모두 true인지 확인해서 반환해라!
                }
            };

            //항목 검사
            $("[name=lectureTitle]").on("blur", function(){
                var valid = $(this).val().length > 0;
                $(this).removeClass("success fail").addClass(valid ? "success" : "fail");
                state.lectureTitleValid = valid;
            });
            $("[name=lectureCategory]").on("input", function(){
                var regex = /^(이론|실습|시험)$/;
                var valid = regex.test($(this).val());
                $(this).removeClass("success fail").addClass(valid ? "success" : "fail");
                state.lectureCategoryValid = valid;
            });
            $("[name=lectureDuration]").on("blur", function(){
                var duration = parseInt($(this).val());//NaN 나올 수 없음
                var valid = duration <= 300 && duration % 30 == 0;
                $(this).removeClass("success fail").addClass(valid ? "success" : "fail");
                state.lectureDurationValid = valid;//state에 결과 저장
            });
            $("[name=lecturePrice]").on("blur", function(){
                var price = parseInt($(this).val());
                var valid = price >= 0 && price <= 1000000000;
                $(this).removeClass("success fail").addClass(valid ? "success" : "fail");
                state.lecturePriceValid = valid;//state에 결과 저장
            });
            $("[name=lectureType]").on("input", function(){
                var regex = /^(온라인|오프라인|혼합)$/;
                var valid = regex.test($(this).val());
                $(this).removeClass("success fail").addClass(valid ? "success" : "fail");
                state.lectureTypeValid = valid;//state에 결과 저장
            });

            //숫자 입력창 처리
            $("[inputmode=numeric]").on("input", function(){
                var originValue = $(this).val();
                var replaceValue = originValue.replace(/[^0-9]/g, "");
                $(this).val(parseInt(replaceValue || 0));//replaceValue가 빈칸이면 0으로 대체
            });
            
            //폼 검사
            $(".form-check").on("submit", function(){
                //화면 처리(이벤트 트리거)
                $(this).find("select[name]").trigger("input");
                $(this).find("input[name], textarea[name]").trigger("blur");

                return state.ok();//state.ok() 상태에 따라 전송해!
            });
        });
    </script>

    <script type="text/javascript">
        //이미지 미리보기 처리 (개수 무관)
        $(function(){
            $(".preview-input").on("input", function(){
                //미리보기를 생성하기 전에 기존에 .preview-area에 있는 이미지를 제거
                // - 있을지 없을지 모르며 있다면 URL.revokeObjectURL()을 써서 회수까지 해줘야함
                // - jQuery에서 제공하는 반복 함수 each를 사용 (for보다 편함)
                $(".preview-area").find("img").each(function(){
                    //this == 현재 순서의 이미지
                    //이미지 주소 회수 + 이미지 태그 삭제 (or 영역 비우기)
                    var address = $(this).attr("src");
                    URL.revokeObjectURL(address);//자원회수
                    //$(this).remove();//이 태그 삭제
                });
                $(".preview-area").empty();//영역 비우기

                //미리보기 생성
                if(this.files.length > 0) {//파일 선택
                    for(var i=0; i < this.files.length; i++) {//선택한 파일수만큼
                        //이미지를 만들어서 .preview-area에 추가
                        var img = $("<img>")   
                                    .addClass("image-shadow image-round")
                                    .attr("src", URL.createObjectURL(this.files[i]))
                                    .prop("height", 100);
                        $(".preview-area").append(img);
                    }
                }
            });
        });
    </script>
</head>
<body>
    <form action="" method="post" enctype="multipart/form-data" autocomplete="off" class="form-check">

    <div class="container w-600 mt-50 mb-50">
        <div class="cell center">
            <h1>강좌 정보 등록</h1>
        </div>

        <div class="cell mt-40">
            <label>강좌명 <i class="fa-solid fa-asterisk red"></i></label>
            <input type="text" name="lectureTitle" placeholder="e.g., 정보처리 산업기사"
                class="field w-100">
            <div class="success-feedback">올바른 형식입니다</div>
            <div class="fail-feedback">필수 항목입니다</div>
        </div>

        <div class="cell">
            <label>카테고리 <i class="fa-solid fa-asterisk red"></i></label>
            <select name="lectureCategory" class="field w-100">
                <option value="">선택하세요</option>
                <option>이론</option>
                <option>실습</option>
                <option>시험</option>
            </select>
            <div class="fail-feedback">필수 선택 항목입니다</div>
        </div>

        <div class="cell">
            <label>강의시간 <i class="fa-solid fa-asterisk red"></i></label>
            <input type="text" inputmode="numeric" name="lectureDuration" class="field w-100" value="0">
            <div class="success-feedback">강의시간이 설정되었습니다</div>
            <div class="fail-feedback">30시간 단위로 최대 300시간 이내에서 설정 가능합니다</div>
        </div>

        <div class="cell">
            <label>수강료 <i class="fa-solid fa-asterisk red"></i></label>
            <input type="text" inputmode="numeric" name="lecturePrice" class="field w-100" value="0">
            <div class="success-feedback">수강료가 설정되었습니다</div>
            <div class="fail-feedback">수강료는 0 이상으로 설정해야 합니다</div>
        </div>

        <div class="cell">
            <label>강의형태 <i class="fa-solid fa-asterisk red"></i></label>
            <select name="lectureType" class="field w-100">
                <option value="">선택하세요</option>
                <option>온라인</option>
                <option>오프라인</option>
                <option>혼합</option>
            </select>
            <div class="fail-feedback">필수 선택 항목입니다</div>
        </div>

        <div class="cell mt-50">
            <label>미리보기</label>
            <input type="file" name="attach" accept=".png, .jpg" multiple 
                    class="field w-100 preview-input">
        </div>
        <div class="cell preview-area">

        </div>

        <div class="cell mt-50">
            <button type="submit" class="btn btn-positive w-100">
                <i class="fa-solid fa-plus"></i>
                <span>신규 강좌 개설하기</span>
            </button>
        </div>

    </div>

    </form>
</body>
</html>
